# Predictive Ranges Trend Pullback runnable signal step (root plan 0016), run via strategy.py + config.toml.
schema = 1
id = "signal.pr_trend_pullback"
kind = "signal"
title = "Predictive Ranges Trend Pullback"
description = "Trade pullbacks to the inner Predictive Ranges band in a stepping trend, confirmed by a reversal bar (recipe.pr-trend-pullback)."
tags = ["predictive_ranges", "signal", "pullback", "recipe"]
version = "1.0.0"
strategy_api_version = "1.0.0"

[params.length]
type = "int"
description = "Predictive Ranges lookback length."
default = 200
min = 2
max = 2000
step = 1

[params.factor]
type = "decimal"
description = "Range width factor."
default = "6"
min = "1"
max = "20"
step = "0.5"

[params.regime_steps]
type = "int"
description = "Consecutive center steps that define a trend regime."
default = 2
min = 1
max = 20
step = 1

[params.lookback]
type = "int"
description = "Bars to look back for a zone touch."
default = 3
min = 1
max = 50
step = 1

[params.stop_buffer_atr]
type = "decimal"
description = "ATR buffer beyond the stop anchor."
default = "0.25"
min = "0"
max = "2"
step = "0.05"

[params.require_alligator]
type = "bool"
description = "Require Alligator alignment for entries."
default = true

[params.qty]
type = "decimal"
description = "Order quantity per entry."
default = "1"
min = "1"
max = "100000"
step = "1"

[params.allow_short]
type = "bool"
description = "Allow short entries."
default = true

[params.stop_policy]
type = "enum"
description = "Stop placement policy."
default = "recipe"
choices = ["recipe", "tight_center", "outer_edge", "outer_atr_buffer", "percentile_shield"]

[requires]

[consumes]
shape = "universe"
columns = ["symbol"]

[emits]
shape = "orders"
adds = []
report = []
reportable = []
